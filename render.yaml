services:
  - type: web
    name: fireworks-planner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: RENDER
        value: true
      # All secrets (DATABASE_URL, SECRET_KEY, GOOGLE_*, R2_*, YOUTUBE_COOKIES)
      # are configured in the Render dashboard → Environment tab.
      # See .env.example in the repo root for the full list.
