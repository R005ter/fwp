name: Build desktop binaries

# Triggers:
#   - push of a tag like v1.2.3 → build all OSes + publish to a GitHub Release
#   - manual run via "Run workflow"           → build + upload as artifacts only
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create / update releases

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: fwp-desktop-linux
            build_output: desktop/dist/fwp-desktop
          - os: windows-latest
            artifact_name: fwp-desktop-windows.exe
            build_output: desktop/dist/fwp-desktop.exe
          - os: macos-latest
            artifact_name: fwp-desktop-mac.zip
            build_output: desktop/dist/fwp-desktop-mac.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux PyWebView depends on system WebKit GTK
      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev

      - name: Install Python deps
        working-directory: desktop
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build binary
        working-directory: desktop
        run: python build.py

      - name: Stage artifact
        shell: bash
        run: |
          set -e
          src="${{ matrix.build_output }}"
          dest="desktop/dist/${{ matrix.artifact_name }}"
          if [ ! -e "$src" ]; then
            echo "Build output missing: $src" >&2
            ls -la desktop/dist || true
            exit 1
          fi
          if [ "$src" != "$dest" ]; then mv "$src" "$dest"; fi
          ls -la desktop/dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
