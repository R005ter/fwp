name: Build desktop binaries

# Triggers:
#   - push of a tag like v1.2.3 → build all OSes + publish to a GitHub Release
#   - manual run via "Run workflow"           → build + upload as artifacts only
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create / update releases

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: fwp-desktop-linux.deb
            # Set in the Build .deb step
            build_output: ''
          - os: windows-latest
            artifact_name: fwp-desktop-windows.exe
            build_output: desktop/dist/fwp-desktop.exe
          - os: macos-latest
            artifact_name: fwp-desktop-mac.zip
            build_output: desktop/dist/fwp-desktop-mac.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- Linux: build a Debian package (no PyInstaller) ----------------
      # The .deb installs the source app and declares system deps so apt
      # resolves PyGObject / WebKit / ffmpeg natively. PyWebView's GTK
      # backend then loads cleanly using the system's installed bindings.
      - name: Install .deb build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev librsvg2-bin

      - name: Build .deb
        if: matrix.os == 'ubuntu-latest'
        working-directory: desktop
        shell: bash
        run: |
          # Strip leading 'v' from the tag for the deb version, default to 0.0.0.
          REF="${GITHUB_REF##*/}"
          VERSION="${REF#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$REF" ]; then VERSION="0.0.0"; fi
          ./build-deb.sh "$VERSION"
          # Rename the produced file to the stable artifact name expected
          # by the matrix.
          built=$(ls dist/fwp-desktop_*_all.deb)
          mv "$built" dist/fwp-desktop-linux.deb
          ls -la dist

      # ---- Mac / Windows: PyInstaller path -------------------------------
      - name: Install Python deps (Mac/Windows)
        if: matrix.os != 'ubuntu-latest'
        working-directory: desktop
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build PyInstaller binary (Mac/Windows)
        if: matrix.os != 'ubuntu-latest'
        working-directory: desktop
        run: python build.py

      # ---- Common: stage + upload ----------------------------------------
      - name: Stage artifact (Mac/Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          src="${{ matrix.build_output }}"
          dest="desktop/dist/${{ matrix.artifact_name }}"
          if [ ! -e "$src" ]; then
            echo "Build output missing: $src" >&2
            ls -la desktop/dist || true
            exit 1
          fi
          if [ "$src" != "$dest" ]; then mv "$src" "$dest"; fi
          ls -la desktop/dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install notes

            **macOS** — the app is signed but not Apple-notarized, so a fresh
            download shows *"fwp-desktop is damaged and can't be opened."* It is
            **not** damaged — that's just Gatekeeper blocking an un-notarized app.
            Clear the quarantine flag once, then open normally:
            ```
            xattr -dr com.apple.quarantine ~/Downloads/fwp-desktop.app
            ```

            **Windows** — SmartScreen may warn; click *More info → Run anyway*.

            **Linux** — `sudo apt install ~/Downloads/fwp-desktop-linux.deb`

            ---
