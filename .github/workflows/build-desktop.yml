name: Build desktop binaries

# Triggers:
#   - push of a tag like v1.2.3 → build all OSes + publish to a GitHub Release
#   - manual run via "Run workflow"           → build + upload as artifacts only
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create / update releases

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: fwp-desktop-linux.AppImage
            build_output: desktop/dist/fwp-desktop-linux.AppImage
          - os: windows-latest
            artifact_name: fwp-desktop-windows.exe
            build_output: desktop/dist/fwp-desktop.exe
          - os: macos-latest
            artifact_name: fwp-desktop-mac.zip
            build_output: desktop/dist/fwp-desktop-mac.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Linux PyWebView depends on system WebKit GTK; librsvg2-bin gives us
      # rsvg-convert for the AppImage icon; FUSE is required by appimagetool.
      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            librsvg2-bin \
            libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Install Python deps
        working-directory: desktop
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Build binary
        working-directory: desktop
        run: python build.py

      - name: Wrap Linux binary in AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          BIN=desktop/dist/fwp-desktop
          test -e "$BIN" || { echo "PyInstaller output missing: $BIN" >&2; ls -la desktop/dist; exit 1; }

          # Build the AppDir layout AppImage expects.
          AD=desktop/AppDir
          rm -rf "$AD"
          mkdir -p "$AD/usr/bin"
          cp "$BIN" "$AD/usr/bin/fwp-desktop"
          chmod +x "$AD/usr/bin/fwp-desktop"

          # AppRun is the AppImage's entrypoint — runs the bundled binary.
          cat > "$AD/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/fwp-desktop" "$@"
          EOF
          chmod +x "$AD/AppRun"

          # Desktop entry — required for AppImage to integrate with launchers.
          cat > "$AD/fwp-desktop.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Fireworks Planner — Add Video
          Exec=fwp-desktop
          Icon=fwp-desktop
          Categories=AudioVideo;Utility;
          Terminal=false
          EOF

          # Icon: convert the project's SVG favicon to a 256x256 PNG.
          rsvg-convert -w 256 -h 256 frontend/public/favicon.svg \
            > "$AD/fwp-desktop.png"

          # Pull appimagetool, build the AppImage.
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --no-appstream "$AD" \
            desktop/dist/fwp-desktop-linux.AppImage
          chmod +x desktop/dist/fwp-desktop-linux.AppImage
          ls -la desktop/dist

      - name: Stage artifact
        shell: bash
        run: |
          set -e
          src="${{ matrix.build_output }}"
          dest="desktop/dist/${{ matrix.artifact_name }}"
          if [ ! -e "$src" ]; then
            echo "Build output missing: $src" >&2
            ls -la desktop/dist || true
            exit 1
          fi
          if [ "$src" != "$dest" ]; then mv "$src" "$dest"; fi
          ls -la desktop/dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -R artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
